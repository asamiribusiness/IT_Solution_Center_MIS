# =============================================
# IT Solution Center MIS - Configuration File
# =============================================

# Application Information
app.name=IT Solution Center MIS
app.version=1.0.0
app.build.date=2026-01-01
company.name=IT Solution Center
app.copyright=\u00a9 2026 Farah IT Solution Center. All rights reserved.

# Database Configuration
db.host=localhost
db.port=3306
db.name=it_solution_center
db.user=root
db.password=admin
db.pool.size=10
db.use.ssl=false
db.max.retries=3
db.retry.delay=2000

# Application Settings
session.timeout=30
max.login.attempts=3
password.expiry.days=90
default.user.role=employee
default.password=admin

# UI Settings
ui.theme=default
ui.language=en
ui.date.format=dd/MM/yyyy
ui.time.format=HH:mm:ss
ui.currency=INR
ui.decimal.places=2

# File Paths
report.template.path=reports/templates/
backup.path=backups/
export.path=exports/
import.path=imports/

# Email Configuration (if needed)
email.host=smtp.gmail.com
email.port=587
email.username=your_email@gmail.com
email.password=your_password
email.from=support@itsolutioncenter.com
email.use.ssl=true

# Logging Configuration
log.level=INFO
log.to.file=true
log.max.size=10MB
log.max.files=5
log.pattern=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Report Settings
report.company.logo=resources/logo.png
report.company.address=Sayed Mir Ajab Street, Farah, Afghanistan
report.company.phone=+93799063252
report.company.email=info@itsolutioncenter.com

# Backup Settings
backup.enabled=true
backup.schedule.daily=true
backup.time=02:00
backup.retention.days=30

# Security Settings
password.min.length=8
password.require.uppercase=true
password.require.lowercase=true
password.require.digits=true
password.require.special=true
encryption.algorithm=AES
encryption.key.size=256

# Business Rules
course.max.students=20
support.response.time.hours=24
project.max.overdue.days=7
invoice.due.days=30
intern.stipend.min=5000
intern.stipend.max=15000

# Network Settings
proxy.enabled=false
proxy.host=
proxy.port=
proxy.username=
proxy.password=

# Debug and Development
debug.mode=false
development.mode=false
test.data.enabled=false
auto.login.enabled=false
auto.login.username=
auto.login.password=

# =============================================
# DO NOT MODIFY BELOW THIS LINE UNLESS NECESSARY
# =============================================
# Application internal settings
config.version=1.0
config.last.updated=2026-01-01